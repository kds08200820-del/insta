name: [수동 전용] 인스타 트렌드 TOP3 단독 실행

# ⚠ 스케줄 제거됨 — 자동 발행은 daily-publish.yml(통합 발행기)이 담당한다.
#   이 워크플로를 그대로 두면 트렌드 TOP3 가 하루 두 번 올라간다.
#   여기서는 수동 실행(단독 테스트)만 가능하다.
on:
  workflow_dispatch:        # 수동 실행 단추
    inputs:
      preview:
        description: '미리보기 (인스타 게시·저장 없이 테스트만)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: insta-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 한글 글꼴 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 프로그램 준비
        run: pip install --quiet apify-client pillow requests

      - name: 인스타 자동화 실행
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREVIEW: ${{ inputs.preview && '1' || '' }}
        run: python automation.py
